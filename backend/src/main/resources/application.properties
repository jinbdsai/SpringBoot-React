server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/toydb?useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=toyuser
spring.datasource.password=toypass1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.backend.tag.dto,com.example.backend.like.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.application.name=backend

# Media upload
media.storage-dir=./uploads
media.public-base-url=/api/media
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
